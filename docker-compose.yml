name: mytasklists

# ─────────────────────────────────────────────────────────────
#  Arquitectura:
#
#    nginx (proxy)  ─┬─ /            → landing   (estático)
#                    ├─ /app/        → frontend  (React SPA)
#                    ├─ /dashboard/  → dashboard (React SPA)
#                    ├─ /api/        → backend   (NestJS + Fastify)
#                    └─ /socket.io/  → backend   (WebSocket)
#
#    backend ─── postgres (datos)
#            ├── redis    (cache + pub/sub de Socket.IO + rate limiting)
#            └── mailpit  (SMTP de desarrollo; en producción, tu SMTP real)
#
#  Este archivo es el entorno de DESARROLLO. Para producción:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ────────────────────────── Base de datos ──────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: lc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mytasklists}
      POSTGRES_USER: ${POSTGRES_USER:-lista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lista_dev_password}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      # Desde PostgreSQL 18 el volumen se monta en /var/lib/postgresql (los datos
      # viven en /var/lib/postgresql/18/docker). Volumen nuevo para no mezclarlo
      # con los datos de la 16: ver "Actualizar PostgreSQL" en el README.
      - postgres18-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo accesible desde esta máquina (herramientas de BD locales)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lista} -d ${POSTGRES_DB:-mytasklists}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lc-net]
    logging: *default-logging

  # ─────────────────────────────── Cache ──────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: lc-redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lista_dev_redis}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-lista_dev_redis}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lc-net]
    logging: *default-logging

  # ───────────────────── Correo de desarrollo (Mailpit) ───────────────
  # Captura todos los correos que envía el backend. Bandeja: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: lc-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [lc-net]
    logging: *default-logging

  # ────────────────────────────── Backend ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    container_name: lc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      TZ: ${TZ:-America/Mexico_City}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mytasklists}
      POSTGRES_USER: ${POSTGRES_USER:-lista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lista_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lista_dev_redis}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-}
      ALLOW_TIME_TRAVEL: ${ALLOW_TIME_TRAVEL:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Apagado por defecto: crea cuentas con contraseñas públicas (el .env de
      # desarrollo lo enciende para las pruebas e2e)
      RUN_SEED: ${RUN_SEED:-false}
      RECURRENCE_CRON: ${RECURRENCE_CRON:-0 */5 * * * *}
      # Rate limiting (vacío = valores por defecto según NODE_ENV)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-}
      RATE_LIMIT_SENSITIVE: ${RATE_LIMIT_SENSITIVE:-}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
      # Correo (en desarrollo, Mailpit)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-MyTaskLists <no-responder@mytasklists.local>}
      # Google / Apple
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
      GOOGLE_ALLOWED_AUDIENCES: ${GOOGLE_ALLOWED_AUDIENCES:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_CALLBACK_URL: ${APPLE_CALLBACK_URL:-http://localhost:8080/api/auth/apple/callback}
      APPLE_ALLOWED_AUDIENCES: ${APPLE_ALLOWED_AUDIENCES:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # App móvil: por debajo de esta versión la API responde 426 (docs/COMPATIBILIDAD.md)
      MOBILE_MIN_VERSION: ${MOBILE_MIN_VERSION:-1.0.0}
      MOBILE_STORE_URL_IOS: ${MOBILE_STORE_URL_IOS:-}
      MOBILE_STORE_URL_ANDROID: ${MOBILE_STORE_URL_ANDROID:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [lc-net]
    logging: *default-logging

  # ────────────────────────────── Frontend ────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
        VITE_GOOGLE_ENABLED: ${VITE_GOOGLE_ENABLED:-true}
        VITE_APPLE_ENABLED: ${VITE_APPLE_ENABLED:-true}
    container_name: lc-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/app/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lc-net]
    logging: *default-logging

  # ────────────────────────────── Dashboard ───────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: lc-dashboard
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/dashboard/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lc-net]
    logging: *default-logging

  # ─────────────────────────── Landing page ───────────────────────────
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
      args:
        LANDING_IOS_URL: ${LANDING_IOS_URL:-#}
        LANDING_ANDROID_URL: ${LANDING_ANDROID_URL:-#}
        LANDING_LEGAL_NAME: ${LANDING_LEGAL_NAME:-}
        LANDING_LEGAL_ADDRESS: ${LANDING_LEGAL_ADDRESS:-}
        LANDING_PRIVACY_EMAIL: ${LANDING_PRIVACY_EMAIL:-}
    container_name: lc-landing
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lc-net]
    logging: *default-logging

  # ──────────────────────── Proxy web (entrada) ───────────────────────
  nginx:
    image: nginx:1.30-alpine
    container_name: lc-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      dashboard:
        condition: service_started
      landing:
        condition: service_started
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lc-net]
    logging: *default-logging

volumes:
  postgres18-data:
  redis-data:

networks:
  lc-net:
    driver: bridge
