upstream backend_upstream   { server backend:3000;  keepalive 32; }
upstream frontend_upstream  { server frontend:80;   keepalive 16; }
upstream dashboard_upstream { server dashboard:80;  keepalive 16; }
upstream landing_upstream   { server landing:80;    keepalive 16; }

server {
    listen 80;
    server_name _;

    # ── Salud del proxy ────────────────────────────────────────────────
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── API REST ───────────────────────────────────────────────────────
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_pass http://backend_upstream;
    }

    # ── WebSocket (tiempo real de las listas compartidas) ──────────────
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
        proxy_pass http://backend_upstream;
    }

    # ── Aplicacion web de usuarios ─────────────────────────────────────
    location /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://frontend_upstream;
    }
    location = /app { return 301 /app/; }

    # ── Panel de administracion ────────────────────────────────────────
    location /dashboard/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://dashboard_upstream;
    }
    location = /dashboard { return 301 /dashboard/; }

    # ── Landing page (raiz) ────────────────────────────────────────────
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://landing_upstream;
    }
}
