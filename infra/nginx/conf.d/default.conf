# Entorno de desarrollo: HTTP en el puerto publicado (8080 por defecto).
# Produccion usa infra/nginx/prod/default.conf (HTTPS + HSTS + limites por IP).
include /etc/nginx/snippets/upstreams.conf;

server {
    listen 80;
    server_name _;

    # ── Salud del proxy ────────────────────────────────────────────────
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    include /etc/nginx/snippets/locations.conf;
}
