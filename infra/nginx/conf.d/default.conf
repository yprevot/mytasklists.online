# Entorno de desarrollo: HTTP en el puerto publicado (8080 por defecto).
# Producción usa infra/nginx/prod/default.conf (HTTPS + HSTS + límites por IP).
include /etc/nginx/snippets/upstreams.conf;

# Protocolo original que ve el backend (aquí nginx es el borde: es el del cliente)
map $scheme $forwarded_proto { default $scheme; }

server {
    listen 80;
    server_name _;

    # ── Salud del proxy ────────────────────────────────────────────────
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    include /etc/nginx/snippets/locations.conf;
}
