# Docker cambia la IP de un contenedor cada vez que lo recrea (`up -d --build`).
# Con `resolve` nginx vuelve a consultar el DNS interno de Docker y sigue la IP
# nueva sin reiniciarse; sin el, apuntaria a la vieja (o a otro contenedor).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream   { zone backend_upstream 64k;   server backend:3000 resolve; keepalive 32; }
upstream frontend_upstream  { zone frontend_upstream 64k;  server frontend:80 resolve;   keepalive 16; }
upstream dashboard_upstream { zone dashboard_upstream 64k; server dashboard:80 resolve;  keepalive 16; }
upstream landing_upstream   { zone landing_upstream 64k;   server landing:80 resolve;    keepalive 16; }
