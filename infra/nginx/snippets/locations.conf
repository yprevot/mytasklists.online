# Rutas comunes a los entornos de desarrollo (HTTP) y producción (HTTPS).

# ── API REST ───────────────────────────────────────────────────────
location /api/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_read_timeout 60s;
    proxy_pass http://backend_upstream;
}

# ── WebSocket (tiempo real de las listas compartidas) ──────────────
location /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
    proxy_buffering off;
    proxy_pass http://backend_upstream;
}

# ── Aplicación web de usuarios ─────────────────────────────────────
location /app/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://frontend_upstream;
}
location = /app { return 301 /app/; }

# ── Panel de administración ────────────────────────────────────────
location /dashboard/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://dashboard_upstream;
}
location = /dashboard { return 301 /dashboard/; }

# ── Landing page (raíz) ────────────────────────────────────────────
location / {
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://landing_upstream;
}
