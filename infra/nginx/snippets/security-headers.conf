# Cabeceras de seguridad para las paginas (landing, app web y panel).
# Se incluyen en cada `location` que sirve HTML: en nginx un `add_header`
# dentro de una location anula los heredados, por eso no van a nivel server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Los navegadores solo la respetan por HTTPS: en desarrollo (HTTP) no tiene efecto
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Todo se sirve desde el propio dominio; los estilos en linea los usan
# Bootstrap y algunos componentes. Google/Apple son navegaciones, no recursos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
