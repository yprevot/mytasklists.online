# Producción: HTTPS obligatorio. Sustituye listadecompras.example.com por tu dominio
# y coloca los certificados en infra/nginx/certs/ (fullchain.pem + privkey.pem).
include /etc/nginx/snippets/upstreams.conf;

# Límites por IP en los endpoints de autenticación (además del rate limiting del backend)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_status 429;

# ── HTTP → HTTPS (y reto ACME de Let's Encrypt) ──────────────────────
server {
    listen 80;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name listadecompras.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: el navegador no volverá a intentar HTTP durante un año. Las
    # locations con cabeceras propias la reciben desde security-headers.conf.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Login, registro, 2FA y recuperación: ráfagas cortas y nada más
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_pass http://backend_upstream;
    }

    location /api/docs {
        return 404;
    }

    include /etc/nginx/snippets/locations.conf;
}
