# Entra con la cuenta que dejó scripts/crear-cuenta.js en output.cuenta
appId: com.listadecompras.app
---
- tapOn:
    id: login-email
- inputText: ${output.cuenta.email}
- tapOn:
    id: login-password
- inputText: ${output.cuenta.password}
- hideKeyboard
- tapOn:
    id: login-submit
- runFlow:
    when:
      platform: iOS
    # iOS ofrece guardar la contraseña en un diálogo del sistema que tapa la app
    commands:
      - tapOn:
          text: Ahora no|Not Now
          optional: true
- extendedWaitUntil:
    visible:
      id: lists-screen
    timeout: 20000
